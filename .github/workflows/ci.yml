name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples charter
      - name: Test
        run: pytest -v
      - name: Validate example charters
        run: |
          for f in charter/examples/*.yaml; do
            python charter/validate.py "$f"
          done
      - name: Run worked examples
        run: |
          python examples/skill-mutation-allowed.py
          python examples/skill-mutation-denied.py
          python examples/revision-chain.py
